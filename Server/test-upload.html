<!DOCTYPE html>
<html>
<head>
    <title>Test Upload Avatar</title>
</head>
<body>
    <h2>Test Upload Avatar</h2>
    <form id="uploadForm">
        <input type="file" id="avatar" accept="image/jpeg,image/jpg,image/png" required>
        <button type="submit">Upload</button>
    </form>
    <div id="result"></div>
    <img id="preview" style="max-width: 200px; display: none;">

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('avatar');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Vui lòng chọn file');
                return;
            }
            
            const formData = new FormData();
            formData.append('avatar', file);
            
            try {
                // Thay YOUR_JWT_TOKEN bằng token thực tế
                const response = await fetch('http://localhost:5000/student/upload-avatar', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer YOUR_JWT_TOKEN'
                    },
                    body: formData
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = JSON.stringify(result, null, 2);
                
                if (result.avatarUrl) {
                    const img = document.getElementById('preview');
                    img.src = result.avatarUrl;
                    img.style.display = 'block';
                }
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
